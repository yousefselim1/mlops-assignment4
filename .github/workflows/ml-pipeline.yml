# .github/workflows/ml-pipeline.yml
name: ML Model CI
on:
  push:
    branches-ignore:
      - main
  pull_request:
jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Linter Check
        run: pip install flake8 && flake8 train.py --max-line-length=120 --exit-zero

      - name: Model Smoke Test
        run: python train.py --lr 0.001 --batch_size 64 --epochs 1

      - name: Upload project-doc Artifact
        uses: actions/upload-artifact@v4
        
        with:
          name: project-doc
          path: README.md
